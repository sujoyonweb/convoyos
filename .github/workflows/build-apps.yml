name: Build convoyOS Android APK & Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Host Libraries Required by Tauri CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Setup Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Prepare Isolated Frontend Dist & Install Tauri CLI
        run: |
          mkdir -p dist
          cp index.html manifest.json sw.js dist/
          cp -r css js assets dist/
          npm install

      - name: Initialize Tauri Android Project & Stamp App Icons
        run: |
          npx tauri android init --ci
          npx tauri icon ./assets/icon-512.png

      - name: Patch AndroidManifest.xml Permissions Safely
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(p)) {
              let xml = fs.readFileSync(p, "utf8");
              xml = xml.replace(/\$\{usesCleartextTraffic\}/g, "true");
              const perms = [
                "<uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />",
                "<uses-permission android:name=\"android.permission.CHANGE_WIFI_MULTICAST_STATE\" />",
                "<uses-permission android:name=\"android.permission.CAMERA\" />"
              ].join("\n    ");
              if (!xml.includes("CHANGE_WIFI_MULTICAST_STATE")) {
                xml = xml.replace("<application", perms + "\n    <application");
              }
              fs.writeFileSync(p, xml, "utf8");
              console.log("Patched AndroidManifest.xml successfully:");
              console.log(xml);
            }
          '

      - name: Compile Android .APK & Play Store .AAB
        run: |
          npx tauri android build --ci

      - name: Sign Android .APK & Play Store .AAB
        run: |
          KEYSTORE="$RUNNER_TEMP/convoyos-release.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias convoyos \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass convoyos123 \
            -keypass convoyos123 \
            -dname "CN=Sujoy Biswas, OU=convoyOS, O=convoyOS, L=Kalyani, S=WB, C=IN"

          mkdir -p signed-output

          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | sort | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"
          if [ -n "$UNSIGNED_APK" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/zipalign" -v -p 4 "$UNSIGNED_APK" signed-output/aligned.apk
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias convoyos \
              --ks-pass pass:convoyos123 \
              --key-pass pass:convoyos123 \
              --out signed-output/convoyOS-v0.1.0.apk \
              signed-output/aligned.apk
            rm -f signed-output/aligned.apk
          fi

          UNSIGNED_AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" | sort | head -n 1)
          echo "Found unsigned AAB: $UNSIGNED_AAB"
          if [ -n "$UNSIGNED_AAB" ]; then
            cp "$UNSIGNED_AAB" signed-output/convoyOS-PlayStore-v0.1.0.aab
            jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore "$KEYSTORE" \
              -storepass convoyos123 \
              -keypass convoyos123 \
              signed-output/convoyOS-PlayStore-v0.1.0.aab \
              convoyos
          fi

          ls -lh signed-output/

      - name: Upload Signed Android .APK & Play Store .AAB
        uses: actions/upload-artifact@v4
        with:
          name: convoyOS-Android-APK-and-PlayStore-AAB
          path: |
            signed-output/convoyOS-v0.1.0.apk
            signed-output/convoyOS-PlayStore-v0.1.0.aab