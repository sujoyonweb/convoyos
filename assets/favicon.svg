<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- DEFINITIONS & EFFECTS -->
    <defs>
        <!-- Dark Squircle Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#222226" />
            <stop offset="100%" stop-color="#0d0d0f" />
        </linearGradient>
        
        <!-- Premium Core Accent Gradient (Blue -> Purple -> Emerald) -->
        <linearGradient id="sGrad" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>

        <!-- Subtle Tech Orbit Gradient -->
        <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
        </linearGradient>

        <!-- Intense Core Glow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="16" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- BASE LAYER: iOS Squircle -->
    <rect width="512" height="512" rx="116" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2"/>

    <!-- MIDDLE LAYER: The OS Tracker Orbit -->
    <circle cx="256" cy="256" r="184" fill="none" stroke="url(#orbitGrad)" stroke-width="3" stroke-dasharray="4 16" stroke-linecap="round"/>

    <!-- TOP LAYER: The "S" Progress Line -->
    <path d="M 356 160 L 156 160 A 48 48 0 0 0 156 256 L 356 256 A 48 48 0 0 1 356 352 L 156 352"
          fill="none" stroke="url(#sGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- NODE 1: Concept Checkpoint (Top Right) -->
    <circle cx="356" cy="160" r="20" fill="#0d0d0f" />
    <circle cx="356" cy="160" r="8" fill="#3b82f6" />

    <!-- NODE 2: Practice Checkpoint (Center) -->
    <circle cx="256" cy="256" r="20" fill="#0d0d0f" />
    <circle cx="256" cy="256" r="8" fill="#8b5cf6" />

    <!-- NODE 3: Test Checkpoint (Bottom Left) -->
    <circle cx="156" cy="352" r="20" fill="#0d0d0f" />
    <circle cx="156" cy="352" r="8" fill="#10b981" />
</svg>
