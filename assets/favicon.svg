<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Main Squircle Electric Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Inner Ambient Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Top Glass Highlight -->
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Center Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Soft Drop Shadow for Centerpiece -->
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#090d16" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- 1. Base Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#coreGlow)" />

  <!-- 2. Outer P2P Radar Ring -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.14" stroke-dasharray="28 20" />

  <!-- 3. Inner Orbital Mesh Ring -->
  <circle cx="512" cy="512" r="264" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.22" />

  <!-- 4. Connected P2P Satellite Nodes (Top-Left & Bottom-Right) -->
  <circle cx="325" cy="325" r="26" fill="#ffffff" fill-opacity="0.92" />
  <circle cx="325" cy="325" r="44" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.35" />

  <circle cx="699" cy="699" r="26" fill="#ffffff" fill-opacity="0.92" />
  <circle cx="699" cy="699" r="44" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.35" />

  <!-- 5. Specular Glass Rim -->
  <rect x="36" y="36" width="952" height="952" rx="220" fill="none" stroke="url(#glassEdge)" stroke-width="8" />

  <!-- 6. Central convoyOS Lightning Bolt -->
  <path d="M566 156 L262 548 H482 L442 868 L762 476 H542 L566 156 Z" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" filter="url(#boltShadow)" />
</svg>