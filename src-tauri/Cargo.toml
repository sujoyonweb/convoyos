[package]
name = "convoyos"
version = "0.1.0"
description = "convoyOS - Ultra-Fast P2P & Offline LAN File Sharing"
authors = ["Sujoy Biswas"]
edition = "2021"

[lib]
name = "convoyos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }