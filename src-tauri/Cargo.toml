[package]
name = "convoyos"
version = "0.1.0"
description = "convoyOS Fast Local & P2P File Sharing"
authors = ["Sujoy Biswas"]
edition = "2021"

[lib]
name = "convoyos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "time", "macros"] }
socket2 = { version = "0.5", features = ["all"] }